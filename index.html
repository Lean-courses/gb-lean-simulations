<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="hub.pageTitle"></title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="shared/tokens.css">
  <link rel="stylesheet" href="shared/base.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>
  <header id="site-header"></header>

  <main id="main" class="page container">
    <h2 class="eyebrow" id="sims-heading" data-i18n="home.eyebrow"></h2>
    <ul class="sim-list" id="sim-list" aria-labelledby="sims-heading"></ul>
  </main>

  <footer id="site-footer"></footer>

  <!-- Classic scripts (not modules) so the site also works opened from disk. Order matters. -->
  <script defer src="shared/config.js"></script>
  <script defer src="shared/i18n.js"></script>
  <script defer src="shared/icons.js"></script>
  <script defer src="shared/header.js"></script>
  <script defer src="simulations/registry.js"></script>
  <script>
    // Runs after the deferred scripts above.
    document.addEventListener('DOMContentLoaded', () => {
      const { initI18n, onLangChange, localize, t, has, updateLinks } = LSS.i18n;
      const { renderHeader, renderFooter } = LSS.header;
      const { icon } = LSS.icons;
      const { liveSimulations } = LSS.registry;
      const list = document.getElementById('sim-list');

      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const tagLabel = (id) => {
        const key = `tags.${id}`;
        if (has(key)) return t(key);
        const words = id.replace(/[-_]+/g, ' ');
        return words.charAt(0).toUpperCase() + words.slice(1);
      };

      function renderList() {
        const sims = liveSimulations();
        if (!sims.length) {
          list.innerHTML = `<li><p>${esc(t('home.empty'))}</p></li>`;
          return;
        }
        // Una fila por simulación: miniatura, título, una línea de descripción
        // y los tags como texto corrido. La lista crece sin romperse.
        list.innerHTML = sims.map((s) => `
          <li class="sim-row">
            <a class="sim-row__link" href="${esc(s.path)}" data-keep-lang data-sim="${esc(s.id)}">
              <span class="sim-row__media">
                <img src="${esc(s.thumbnail)}" alt="" width="320" height="180" loading="lazy" decoding="async">
              </span>
              <span class="sim-row__text">
                <h3 class="sim-row__title">${esc(localize(s.title))}</h3>
                <span class="sim-row__desc">${esc(localize(s.description))}</span>
                ${s.tags.length ? `<span class="sim-row__tags">${s.tags.map((tag) => esc(tagLabel(tag))).join(' · ')}</span>` : ''}
              </span>
              <span class="sim-row__go" aria-hidden="true">${icon('arrowRight', { size: 18 })}</span>
            </a>
          </li>`).join('');
        updateLinks(list);
      }

      renderHeader({ variant: 'home' });
      renderFooter();
      onLangChange(renderList);
      initI18n();
    });
  </script>
</body>
</html>
